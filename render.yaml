# Render Blueprint for SM Life Streaming (standalone copy).
#
# How to use it:
#   1. Push this repo to GitHub (private repo is fine).
#   2. In Render: New > Blueprint > connect the repo. Render reads this file.
#   3. Set DATABASE_URL in the dashboard to the Neon Postgres connection
#      string (create the free Neon project first — no card needed).
#   4. OWNER_PASS is generated by Render (random value) — read it in the
#      dashboard (Environment tab) and keep it somewhere safe; it is the
#      password the app asks for when it opens.
#   5. Optionally set GEMINI_API_KEY (free key from Google AI Studio) to
#      switch the AI features on; without it the app uses built-in fallbacks.
#   6. Run the data migration once (scripts/migrate.ts) to copy the library
#      from the Muse original into Neon. See DEPLOY.md.
#
# Notes:
# - Free web services sleep after 15 minutes with no traffic and take about
#   a minute to wake. That is the free tier, not a bug.
# - The database is Neon (free, permanent, no card), NOT Render's free
#   Postgres — Render's free Postgres deletes all its data after 30 days.
# - If Render asks for a credit card at any point, STOP: the no-card path
#   has failed and nothing here should be paid for.

services:
  - type: web
    name: sm-life-streaming
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OWNER_USER
        value: owner
      - key: OWNER_PASS
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
